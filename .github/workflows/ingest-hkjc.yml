name: ingest-hkjc-daily
on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Fetch official candidates + parse
        env:
          PYTHONPATH: src
        run: python -m marksix_rd.ingest
      - name: Also archive raw HTTP bodies with curl
        run: |
          mkdir -p data/raw
          DAY=$(date -u +%F)
          set +e
          curl -fsSL -A "marksix-rd-ci" \
            "https://bet.hkjc.com/contentserver/jcbw/cmc/last30draw.json" \
            -o "data/raw/hkjc_curl_${DAY}.json"
          echo "curl_exit=$?" >> data/raw/hkjc_curl_${DAY}.meta.txt
          ls -l data/raw | tee -a data/raw/hkjc_curl_${DAY}.meta.txt
      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): daily HKJC snapshot $(date -u +%F)"
            git push
          fi
