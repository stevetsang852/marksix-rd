name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q --tb=short
      - name: Import smoke
        env:
          PYTHONPATH: src
        run: python -c "from marksix_rd.analyze import summary; from marksix_rd.era import TAB_ORDER; print(TAB_ORDER)"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t marksix-rd:ci .
      - name: Pytest inside image
        run: docker run --rm -e PYTHONPATH=/app/src marksix-rd:ci pytest -q --tb=short
